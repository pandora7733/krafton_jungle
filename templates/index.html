<!DOCTYPE html>
<html lang="ko">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />

    <!-- 이 부분은 절대 지우지 마세요. -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- 이 부분은 절대 지우지 마세요. -->

    <!-- 구글폰트 -->
    <link
      href="https://fonts.googleapis.com/css?family=Stylish&display=swap"
      rel="stylesheet"
    />

    <!-- 구글 아이콘 -->
    <link 
      rel="stylesheet" 
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=thumb_up" 
    />

    <title>크래프톤 정글 | 나홀로 링크 메모장!</title>

    <!-- style -->
    <style type="text/css">
      * {
        font-family: "Stylish", sans-serif;
      }

      .wrap {
        width: 900px;
        margin: auto;
      }

      .comment {
        color: blue;
        font-weight: bold;
      }

      #wrap {
        padding-left: 20% !important
      }

      .btn {
        height: 2.5rem;
      }

      .material-symbols-outlined {
        font-variation-settings:
        'FILL' 0,
        'wght' 400,
        'GRAD' 0,
        'opsz' 24
      }
      
    </style>
  </head>

  <body>
    <div class="container" id="wrap">
      <div class="p-5 mb-4 bg-light rounded-3">
        <div class="container-fluid py-5">
          <h1 class="display-4">나홀로메모장 <span class="bg-secondary text-white">ver2.0</span></h1>
          <div class="form-post">
            <div class="form-group">
              <label for="post-title"></label>
              <input id="post-title" class="form-control" placeholder="제목을 입력하세요" />
            </div>
            <div class="form-group pb-3">
              <label for="post-content"></label>
              <textarea
                id="post-content"
                class="form-control"
                rows="2"
                placeholder="내용을 입력하세요"
              ></textarea>
            </div>
            <button type="button" class="btn btn-primary" onclick="postArticle()">
              저장하기
            </button>
          </div>
        </div>
      </div>

      <div id="cards-box" class="row row-cols-1 row-cols-md-3 g-4">
        
      </div>
    </div>

    <!-- 이 부분은 절대 지우지 마세요. -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <!-- 이 부분은 절대 지우지 마세요. -->

    <script>
      $(document).ready(function () {
        $("#cards-box").html("");
        showArticles();
      });

      function updateArticle(title) {
        let content = $("#post-content").val();
        $.ajax({
          type: "POST",
          url: "/update",
          data: { title_give: title, content_give: content },
          success: function (response) {
            //성공하면
            if (response["result"] == "success") {
              alert("수정 성공!");
            //성공하면 새로고침
              window.location.reload();
            } else {
              alert("서버 오류!");
            }
          }
        });
      }

      function deleteArticle(title) {
        $.ajax({
          type: "POST",
          url: "/delete",
          data: { title_give: title },
          success: function (response) {
            window.location.reload();
          }
        });
      }

      function likeArticle(title) {
        $.ajax({
          type: "POST",
          url: "/like",
          data: { title_give: title },
          success: function (response) {
            window.location.reload();
          }
        });
      }

      function postArticle() {
        let title = $("#post-title").val();
        let content = $("#post-content").val();

        // 2. memo에 POST 방식으로 메모 생성 요청하기
        $.ajax({
          type: "POST", // POST 방식으로 요청하겠다.
          url: "/save", // /save라는 url에 요청하겠다.
          data: { title_give: title, content_give: content }, // 데이터를 주는 방법
          success: function (response) {
            // 성공하면
            if (response["result"] == "success") {
              alert("포스팅 성공!");
              // 3. 성공 시 페이지 새로고침하기
              window.location.reload();
            } else {
              alert("서버 오류!");
            }
          },
        });
      }

      function showArticles() {
        $.ajax({
          type: "GET",
          url: "/contents",
          data: {},
          success: function (response) {
            let articles = response["articles"];
            console.log(articles);
            for (let i = 0; i < articles.length; i++) {
              makeCard(
                articles[i]["title"],
                articles[i]["content"],
                articles[i]["likeCount"]
              );
            }
          },
        });
      }

      function makeCard(title, content, likeCount) {
        let tempHtml = `<div class="col">
                          <div class="card">
                            <div class="card-body">
                              <h5 class="card-title">${title}</h5>
                              <p class="card-text">${content}</p>
                              <p id="like-count">${likeCount}</p>
                              <button type="button" class="btn btn-info text-white" onclick="updateArticle('${title}')">수정</button>
                              <button type="button" class="btn btn-danger text-white" onclick="deleteArticle('${title}')">삭제</button>
                              <button type="button" class="btn btn-outline-primary" onclick="likeArticle('${title}')"><span style="position: relative; bottom: 6px;">좋아요</span><span class="material-symbols-outlined">thumb_up</span></button>
                            </div>
                          </div>
                        </div>`;
        $("#cards-box").append(tempHtml);
      }
    </script>
  </body>
</html>
